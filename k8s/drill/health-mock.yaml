# Alert drill: a fake SocialAgent /api/health inside the cluster, so alerts can
# be tested without touching production. See README.md for the drill steps.
# Remove everything afterwards with: kubectl delete -f k8s/drill/health-mock.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: socialagent-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-mock
  namespace: socialagent-test
data:
  mock.py: |
    """Fake SocialAgent /api/health. MOCK_STATUS: ok, degraded or down."""
    import json
    import os
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer

    STATUS = os.environ.get("MOCK_STATUS", "down")


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            now = datetime.now(timezone.utc).isoformat()
            # Same bodies and codes as the real route.ts.
            if STATUS == "down":
                code, body = 503, {"status": "down", "db": False, "checkedAt": now}
            else:
                problems = 2 if STATUS == "degraded" else 0
                code = 200
                body = {"status": STATUS, "db": True, "cronProblems": problems, "checkedAt": now}
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)


    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-mock
  namespace: socialagent-test
  labels:
    app.kubernetes.io/name: health-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-mock
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock
          # The exporter image already has Python and is on the node: nothing new to build or pin.
          image: ghcr.io/tomajzcz/socialagent-exporter:0.1.0@sha256:62194f1e1b43eb49b890348ce2f83d1aa09d7395c2dc754e36b28390c2759ac1
          command: ["python", "/mock/mock.py"]
          env:
            - name: MOCK_STATUS
              value: down
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /mock
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: health-mock
---
apiVersion: v1
kind: Service
metadata:
  name: health-mock
  namespace: socialagent-test
  labels:
    app.kubernetes.io/name: health-mock
spec:
  selector:
    app.kubernetes.io/name: health-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
